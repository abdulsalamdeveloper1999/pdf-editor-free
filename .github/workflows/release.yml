name: Release

# Tag a version with `npm version <x.y.z> && git push --follow-tags`: that bumps
# package.json (which is what electron-builder names the installers after) and
# pushes the matching tag in one go.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Boots the real renderer through the app:// handler. Linux runners have
      # no display, so it goes through xvfb.
      - name: Smoke test
        if: matrix.os != 'ubuntu-latest'
        run: npx electron electron/smoke.cjs
      # Electron fetches its binary on first use, not during `npm ci`, so pull
      # it down before touching chrome-sandbox. Linux runners leave that helper
      # without its setuid bit and Chromium refuses to start rather than run
      # unsandboxed; fix the binary instead of passing --no-sandbox, so the test
      # boots the way users do.
      - name: Smoke test (xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run --auto-servernum npx electron electron/smoke.cjs

      - name: Build installers
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # there is no Developer ID certificate to find; mac.identity is "-",
          # which signs ad-hoc instead. Without this electron-builder hunts the
          # keychain and fails the macOS build.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
